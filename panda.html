<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo AR - Panda</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#f4f4f4; }
  header { background:#1d9e75; color:white; padding:14px 20px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  .dato-curioso { max-width:600px; margin:16px auto; padding:12px 18px; background:#fff3d6; border-left:4px solid #f2a623; border-radius:6px; font-size:15px; }
  model-viewer { width:100%; height:60vh; background:#e9e9e9; }
  .volver { display:block; text-align:center; margin:16px; color:#1d9e75; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<header>
  <h1>Zoo AR Educativo &mdash; Panda</h1>
</header>

<model-viewer src="models/panda.glb"
  ar
  ar-modes="scene-viewer webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="Modelo 3D de Panda">
  <button slot="ar-button" style="background-color:#1d9e75;color:white;border:none;border-radius:6px;padding:10px 16px;font-size:14px;position:absolute;bottom:16px;right:16px;">
    Ver en AR
  </button>
</model-viewer>

<div class="dato-curioso">
  <strong>Dato curioso:</strong> Un panda puede comer hasta 12 horas al día, casi todo bambú.
</div>


<button id="micBtn" style="display:block;margin:16px auto;background:#1d9e75;color:white;border:none;border-radius:24px;padding:10px 22px;font-size:15px;cursor:pointer;">
  🎤 Hablar con el guía
</button>
<p style="text-align:center;font-size:13px;color:#666;margin-top:-4px;">Primero abre el chat (burbuja inferior derecha), luego presiona este botón y habla.</p>

<script>
(function () {
  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.textContent = 'Tu navegador no soporta reconocimiento de voz (usa Chrome)';
    micBtn.disabled = true;
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'es-EC';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  function getMessenger() {
    return document.querySelector('df-messenger');
  }

  micBtn.addEventListener('click', () => {
    micBtn.textContent = '🎙️ Escuchando...';
    recognition.start();
  });

  recognition.addEventListener('result', (event) => {
    const text = event.results[0][0].transcript;
    const dfMessenger = getMessenger();
    if (dfMessenger) {
      dfMessenger.renderCustomText(text, false);
      dfMessenger.sendQuery(text);
    }
    micBtn.textContent = '🎤 Hablar con el guía';
  });

  recognition.addEventListener('end', () => {
    micBtn.textContent = '🎤 Hablar con el guía';
  });

  recognition.addEventListener('error', () => {
    micBtn.textContent = '🎤 Hablar con el guía';
  });
})();
</script>

<!-- Widget del chatbot Dialogflow CX (código oficial de Google) -->
<link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
<script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
<df-messenger
  location="us-central1"
  project-id="zooarbot"
  agent-id="10bd51b1-9901-4450-9fc6-a6c4fbb6e324"
  language-code="es"
  max-query-length="-1">
  <df-messenger-chat-bubble
    chat-title="ZooGuideBot">
  </df-messenger-chat-bubble>
</df-messenger>
<style>
  df-messenger {
    z-index: 999;
    position: fixed;
    --df-messenger-font-color: #000;
    --df-messenger-font-family: Google Sans;
    --df-messenger-chat-background: #f3f6fc;
    --df-messenger-message-user-background: #d3e3fd;
    --df-messenger-message-bot-background: #fff;
    bottom: 16px;
    right: 16px;
  }
</style>

<a class="volver" href="index.html">&larr; Volver al menú de animales</a>

</body>
</html>
