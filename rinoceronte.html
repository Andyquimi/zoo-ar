<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo AR - Rinoceronte blanco</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#f4f4f4; }
  header { background:#1d9e75; color:white; padding:14px 20px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  .dato-curioso { max-width:600px; margin:16px auto; padding:12px 18px; background:#fff3d6; border-left:4px solid #f2a623; border-radius:6px; font-size:15px; }
  model-viewer { width:100%; height:60vh; background:#e9e9e9; }
  .volver { display:block; text-align:center; margin:16px; color:#1d9e75; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<header>
  <h1>Zoo AR Educativo &mdash; Rinoceronte blanco</h1>
</header>

<model-viewer src="models/rinoceronte.glb"
  ar
  ar-modes="scene-viewer webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="Modelo 3D de Rinoceronte blanco">
  <button slot="ar-button" style="background-color:#1d9e75;color:white;border:none;border-radius:6px;padding:10px 16px;font-size:14px;position:absolute;bottom:16px;right:16px;">
    Ver en AR
  </button>
</model-viewer>

<div class="dato-curioso">
  <strong>Dato curioso:</strong> El cuerno del rinoceronte está hecho de queratina, la misma proteína de nuestras uñas.
</div>

<!-- Widget del chatbot Dialogflow CX (código oficial de Google) -->
<link rel="stylesheet" href="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/themes/df-messenger-default.css">
<script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
<df-messenger
  location="us-central1"
  project-id="zooarbot"
  agent-id="10bd51b1-9901-4450-9fc6-a6c4fbb6e324"
  language-code="es"
  max-query-length="-1">
  <df-messenger-chat-bubble
    chat-title="ZooGuideBot">
  </df-messenger-chat-bubble>
</df-messenger>
<style>
  df-messenger {
    z-index: 999;
    position: fixed;
    --df-messenger-font-color: #000;
    --df-messenger-font-family: Google Sans;
    --df-messenger-chat-background: #f3f6fc;
    --df-messenger-message-user-background: #d3e3fd;
    --df-messenger-message-bot-background: #fff;
    bottom: 16px;
    right: 16px;
  }
</style>

<a class="volver" href="index.html">&larr; Volver al menú de animales</a>

</body>
</html>
