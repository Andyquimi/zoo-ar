<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zoo AR - Puma</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#f4f4f4; }
  header { background:#1d9e75; color:white; padding:14px 20px; text-align:center; }
  header h1 { margin:0; font-size:20px; }
  .dato-curioso { max-width:600px; margin:16px auto; padding:12px 18px; background:#fff3d6; border-left:4px solid #f2a623; border-radius:6px; font-size:15px; }
  model-viewer { width:100%; height:60vh; background:#e9e9e9; }
  .volver { display:block; text-align:center; margin:16px; color:#1d9e75; text-decoration:none; font-weight:bold; }
</style>
</head>
<body>
<header>
  <h1>Zoo AR Educativo &mdash; Puma</h1>
</header>

<model-viewer src="models/puma.glb"
  ar
  ar-modes="scene-viewer webxr"
  camera-controls
  auto-rotate
  shadow-intensity="1"
  alt="Modelo 3D de Puma">
  <button slot="ar-button" style="background-color:#1d9e75;color:white;border:none;border-radius:6px;padding:10px 16px;font-size:14px;position:absolute;bottom:16px;right:16px;">
    Ver en AR
  </button>
</model-viewer>

<div class="dato-curioso">
  <strong>Dato curioso:</strong> El puma puede saltar hasta 5 metros de altura de un solo salto.
</div>

<!-- Widget del chatbot Dialogflow CX. Reemplaza AGENT_ID, TU_PROJECT_ID y LOCATION cuando publiques tu agente. -->
<script src="https://www.gstatic.com/dialogflow-console/fast/df-messenger/prod/v1/df-messenger.js"></script>
<df-messenger
  location="LOCATION"
  project-id="TU_PROJECT_ID"
  agent-id="AGENT_ID"
  language-code="es">
  <df-messenger-chat-bubble chat-title="Guía del Zoo AR"></df-messenger-chat-bubble>
</df-messenger>

<a class="volver" href="index.html">&larr; Volver al menú de animales</a>

</body>
</html>
